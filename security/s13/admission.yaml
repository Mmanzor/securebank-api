apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: securebank-verified-image
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image == 'VERIFIED_IMAGE') &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c, c.image == 'VERIFIED_IMAGE')) &&
        (!has(object.spec.ephemeralContainers) ||
          object.spec.ephemeralContainers.all(c, c.image == 'VERIFIED_IMAGE'))
      message: Solo se admite el digest verificado por Cosign.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: securebank-verified-image
spec:
  policyName: securebank-verified-image
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        securebank.ubo/signed-images: required
