env:
  contexts:
    - name: securebank-ci
      urls:
        - http://127.0.0.1:3000
  parameters:
    failOnError: true
    failOnWarning: true
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://127.0.0.1:3000/health
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap
      reportTitle: SecureBank API · laboratorio S09
