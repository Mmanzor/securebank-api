apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securebank-default-deny
  namespace: securebank
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securebank-api-ingress
  namespace: securebank
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securebank-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lab-client
      ports:
        - protocol: TCP
          port: 3000
