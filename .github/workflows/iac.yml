name: S11 - Seguridad IaC

on:
  push:
    branches:
      - main
      - feature/iac-security-s11
      - feature/sesion-11-firmada
    paths:
      - 'terraform/**'
      - 'security/s11/**'
      - .github/workflows/iac.yml
  pull_request:
    branches:
      - main
      - feature/docker-hardening-s10
    paths:
      - 'terraform/**'
      - 'security/s11/**'
      - .github/workflows/iac.yml

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_VERSION: '1.17.2'
  TF_SHA256: e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b

jobs:
  scan-and-gate:
    name: Checkov · scan y gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar Checkov
        run: python -m pip install 'checkov==3.4.11'

      - name: Comparar línea base y código corregido
        shell: bash
        run: |
          mkdir -p iac-evidence
          python security/s11/make_baseline.py terraform "$RUNNER_TEMP/iac-before"
          for phase in before after; do
            directory=terraform
            if [[ "$phase" == before ]]; then directory="$RUNNER_TEMP/iac-before"; fi
            env -u BC_API_KEY -u PRISMA_API_URL checkov --skip-download --skip-results-upload \
              --directory "$directory" --framework terraform --output json --soft-fail \
              > "iac-evidence/$phase.json"
            code=0
            python security/s11/gate.py "iac-evidence/$phase.json" > "iac-evidence/$phase-gate.json" || code=$?
            test "$code" -le 1
            jq '{allow,resources,passed,failed,score,severities}' "iac-evidence/$phase-gate.json"
          done
          jq -e '.allow == false and .severities.CRITICAL > 0' iac-evidence/before-gate.json

      - name: Exigir que pase el gate
        run: python security/s11/gate.py iac-evidence/after.json

      - name: Guardar reportes y decisiones
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-${{ github.sha }}
          path: iac-evidence/
          if-no-files-found: error

  plan:
    name: Terraform · plan sin AWS
    needs: scan-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Terraform
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/terraform.zip"
          printf '%s  %s\n' "$TF_SHA256" "$RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -oq "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/tf-bin"
          echo "$RUNNER_TEMP/tf-bin" >> "$GITHUB_PATH"

      - name: Validar y calcular plan simulado
        shell: bash
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color
          terraform -chdir=terraform test -filter=tests/security.tftest.hcl -verbose -no-color | tee mock-plan.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-plan-${{ github.sha }}
          path: mock-plan.txt

  apply-mock:
    name: Terraform · apply simulado
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Terraform
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/$TF_VERSION/terraform_${TF_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/terraform.zip"
          printf '%s  %s\n' "$TF_SHA256" "$RUNNER_TEMP/terraform.zip" | sha256sum --check
          unzip -oq "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/tf-bin"
          echo "$RUNNER_TEMP/tf-bin" >> "$GITHUB_PATH"

      - name: Aplicar con el proveedor simulado
        shell: bash
        run: |
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform test -filter=tests/apply_mock.tftest.hcl -no-color | tee mock-apply.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-apply-${{ github.sha }}
          path: mock-apply.txt
