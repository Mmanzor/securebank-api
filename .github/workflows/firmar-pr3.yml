name: Preparar commit firmado del PR 3

on:
  push:
    branches: [integracion/preparar-firma-pr3]
    paths: [.github/workflows/firmar-pr3.yml]

permissions:
  contents: write

jobs:
  firmar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Crear el commit firmado a partir del árbol revisado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 80ecc6f56d075b3172c23559e0c3cd9569cb75a9
          SOURCE_SHA: 2faf365ace6a0f714beb86cf8b64c6d818c0da5c
          TARGET_BRANCH: integracion/commit-firmado-pr3
        run: |
          git fetch --no-tags origin main feat/sesiones-05-10
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/feat/sesiones-05-10)" = "$SOURCE_SHA"

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args])

          base = os.environ["BASE_SHA"]
          source = os.environ["SOURCE_SHA"]
          additions = []
          changes = git("diff", "--name-status", "--no-renames", "-z", base, source).split(b"\0")
          if len(changes) < 3 or len(changes[:-1]) % 2:
              raise ValueError("Lista de cambios vacía o inválida.")
          for status, raw_path in zip(changes[0:-1:2], changes[1:-1:2]):
              path = raw_path.decode()
              entry = git("ls-tree", source, "--", path)
              if status not in (b"A", b"M") or not entry.startswith(b"100644 blob "):
                  raise ValueError(f"Cambio no previsto: {path}")
              content = git("show", f"{source}:{path}")
              additions.append({"path": path, "contents": base64.b64encode(content).decode("ascii")})

          body = {
              "query": "mutation($input: CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url tree{oid} signature{isValid}}}}",
              "variables": {"input": {
                  "branch": {
                      "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                      "refName": os.environ["TARGET_BRANCH"],
                  },
                  "expectedHeadOid": base,
                  "message": {
                      "headline": "Integra DevSecOps de las sesiones 05 a 08",
                      "body": "Consolida los cambios revisados en #3. Se conserva el historial original en feat/sesiones-05-10."
                  },
                  "fileChanges": {"additions": additions}
              }},
          }
          Path(os.environ["RUNNER_TEMP"], "sign-request.json").write_text(json.dumps(body))
          PY

          gh api graphql --input "$RUNNER_TEMP/sign-request.json" > "$RUNNER_TEMP/sign-result.json"
          jq -e '.data.createCommitOnBranch.commit.signature.isValid == true' "$RUNNER_TEMP/sign-result.json"
          expected_tree=$(git rev-parse "${SOURCE_SHA}^{tree}")
          jq -e --arg expected "$expected_tree" '.data.createCommitOnBranch.commit.tree.oid == $expected' "$RUNNER_TEMP/sign-result.json"
          jq -r '.data.createCommitOnBranch.commit | "COMMIT_FIRMADO=\(.oid)"' "$RUNNER_TEMP/sign-result.json"
