name: S07 - Bloqueo real por secreto ficticio
on:
  push:
    branches: [evidencia/s07-bloqueo]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Instalar Gitleaks verificado
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL --retry 3 "$url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL --retry 3 "$url/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP"; grep -F "$archive" checksums.txt | sha256sum -c -; tar -xzf "$archive" gitleaks)
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Escaneo que debe bloquear el pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/fixture-secret"
          cat > "$RUNNER_TEMP/fixture-rule.toml" <<'TOML'
          title = "Prueba inerte de bloqueo"
          [[rules]]
          id = "securebank-test-marker"
          description = "Marcador ficticio sin acceso a servicios"
          regex = '''LAB[0-9]{8}END'''
          TOML
          printf '%s%s%s\n' LAB 12345678 END > "$RUNNER_TEMP/fixture-secret/marker.txt"
          # El código de salida del escáner se propaga sin continue-on-error.
          gitleaks dir --config "$RUNNER_TEMP/fixture-rule.toml" --redact --exit-code 1 --report-format json --report-path reports/control-negativo.json "$RUNNER_TEMP/fixture-secret"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s07-evidencia-bloqueo-real
          path: reports/control-negativo.json
          retention-days: 30
          if-no-files-found: error
  package:
    name: Empaquetado condicionado a escaneo limpio
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - run: echo "Control limpio; se permite el empaquetado"
