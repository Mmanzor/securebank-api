name: Preparar commits firmados S09 a S13
on:
  push:
    branches:
      - integracion/preparar-firma-s09-s13
    paths:
      - .github/workflows/firmar-s09-s13.yml
permissions:
  contents: write
jobs:
  firmar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generar y verificar los cinco commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 8c3897672bdce3112644620cf35f1093cc6e264d
          SIGNING_BRANCH: undefined
          SOURCE_SESSIONS: '[{"n":9,"source":"feature/security-gate-s09","sha":"9e9f910e2e1957f48762cd58b7a6bbc3989dcd98","file":"security-gate-s09.yml","branch":"feature/sesion-09-firmada"},{"n":10,"source":"feature/docker-hardening-s10","sha":"af07d27004218aa115efe929c03f178b1bf26ace","file":"docker-security-s10.yml","branch":"feature/sesion-10-firmada"},{"n":11,"source":"feature/iac-security-s11","sha":"4679055117cb8de212e84b559cee591f4d665188","file":"iac.yml","branch":"feature/sesion-11-firmada"},{"n":12,"source":"feature/kubernetes-hardening-s12","sha":"9f54c5646c998e7ab24f8db34a95726d18d76204","file":"kubernetes-s12.yml","branch":"feature/sesion-12-firmada"},{"n":13,"source":"feature/supply-chain-s13","sha":"6667e338f858314b5374ef03b6a43a4dfd1074d2","file":"supply-chain-s13.yml","branch":"feature/sesion-13-firmada"}]'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request
          
          repository = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["SIGNING_BRANCH"]
          main = os.environ["EXPECTED_MAIN"]
          sessions = json.loads(os.environ["SOURCE_SESSIONS"])
          
          def git(*args, data=None, env=None):
              return subprocess.check_output(["git", *args], input=data, env=env)
          
          def git_text(*args, **kwargs):
              return git(*args, **kwargs).decode().strip()
          
          def graphql(query, variables):
              request = urllib.request.Request(
                  os.environ["GITHUB_GRAPHQL_URL"],
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "securebank-signed-integration",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result.get("errors"):
                  raise RuntimeError(result["errors"])
              return result["data"]
          
          if repository != "Mmanzor/securebank-api" or target != "undefined":
              raise RuntimeError("Unexpected repository or signing branch")
          for ref, expected in [("main", main), (target, main)] + [
              (item["source"], item["sha"]) for item in sessions
          ]:
              if git_text("rev-parse", "refs/remotes/origin/" + ref) != expected:
                  raise RuntimeError("Ref moved: " + ref)
          
          def merged_tree(item, workflow_rules):
              tree = git_text("merge-tree", "--write-tree", main, item["sha"])
              index = os.environ | {"GIT_INDEX_FILE": str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "integration.index")}
              git("read-tree", tree, env=index)
              for rule in workflow_rules:
                  path = ".github/workflows/" + rule["file"]
                  oid = git_text("rev-parse", f"{os.environ['GITHUB_SHA']}:{path}")
                  git("update-index", "--cacheinfo", "100644", oid, path, env=index)
              if item["n"] >= 10:
                  path = ".dockerignore"
                  before = git("show", tree + ":" + path)
                  marker = b"!src/**\n"
                  if before.count(marker) != 1:
                      raise RuntimeError("Unexpected Docker context")
                  after = before.replace(marker, marker + b"!package.json\n!package-lock.json\n", 1)
                  oid = git_text("hash-object", "-w", "--stdin", data=after)
                  git("update-index", "--cacheinfo", "100644", oid, path, env=index)
              if item["n"] >= 11:
                  path = "terraform/workloads.tf"
                  oid = git_text("rev-parse", f"{os.environ['GITHUB_SHA']}:{path}")
                  git("update-index", "--cacheinfo", "100644", oid, path, env=index)
              return git_text("write-tree", env=index)
          
          mutation = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit {
                oid
                url
                tree { oid }
                parents(first: 2) { nodes { oid } }
                signature { isValid state }
              }
            }
          }
          """
          
          # Prepare and validate all trees before writing any commits.
          plans = []
          previous_tree = git_text("rev-parse", main + "^{tree}")
          for index, item in enumerate(sessions):
              tree = merged_tree(item, sessions[:index + 1])
              additions = []
              deletions = []
              files = git("diff-tree", "-r", "--no-renames", "--name-only", "-z", previous_tree, tree)
              for path in files.decode().rstrip("\0").split("\0"):
                  if not path:
                      continue
                  entry = git_text("ls-tree", tree, "--", path)
                  if not entry:
                      deletions.append({"path": path})
                      continue
                  if not entry.startswith("100644 blob "):
                      raise RuntimeError("Unexpected Git mode: " + path)
                  contents = base64.b64encode(git("show", tree + ":" + path)).decode()
                  additions.append({"path": path, "contents": contents})
              if not additions and not deletions:
                  raise RuntimeError("Empty session delta")
              print(f"S{item['n']:02}: {len(additions)} additions/updates, {len(deletions)} deletions, tree {tree}", flush=True)
              plans.append((item, tree, additions, deletions))
              previous_tree = tree
          
          previous_commit = main
          for item, tree, additions, deletions in plans:
              result = graphql(mutation, {"input": {
                  "branch": {"repositoryNameWithOwner": repository, "branchName": target},
                  "expectedHeadOid": previous_commit,
                  "message": {"headline": f"Integra DevSecOps de la sesión {item['n']:02}", "body": f"Rama original: {item['source']}\nCommit original: {item['sha']}"},
                  "fileChanges": {"additions": additions, "deletions": deletions},
              }})["createCommitOnBranch"]["commit"]
              if (result["tree"]["oid"] != tree
                  or [p["oid"] for p in result["parents"]["nodes"]] != [previous_commit]
                  or not (result["signature"] or {}).get("isValid")):
                  raise RuntimeError("GitHub commit did not match the plan: " + str(result))
              previous_commit = result["oid"]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"- Sesión {item['n']:02}: [{previous_commit}]({result['url']}) firmado y verificado.\n")
              print(f"SIGNED {item['n']:02} {previous_commit} {result['signature']['state']}", flush=True)
          PY
