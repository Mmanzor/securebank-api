name: Archivar evidencias verificadas
on:
  push:
    branches: [feature/complementos-devsecops]
    paths: [.github/workflows/archivar-evidencias.yml]
permissions:
  contents: read
jobs:
  archive:
    if: github.ref == 'refs/heads/feature/complementos-devsecops'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Descargar artefactos aprobados e históricos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          gh run download 45944833584 --name s05-sarif-reproducido --dir "$tmp/sast"
          gh run download 45944833584 --name s06-sbom-y-vulnerabilidades --dir "$tmp/sca"
          gh run download 45944833584 --name s07-control-negativo --dir "$tmp/secrets"
          gh run download 45944913434 --name s07-evidencia-bloqueo-real --dir "$tmp/negative"
          gh run download 45944833584 --name s08-s11-entregables --dir "$tmp/pdf"
          gh run download 45727010153 --name checkov-22b54d7578046a13042d3f91884ebeb69a0b8c47 --dir "$tmp/iac"
          mkdir -p reports/{sast,secrets,dast,iac}
          cp "$tmp/sast/"{sast-before.sarif,sast-after.sarif,revisiones.txt} reports/sast/
          cp "$tmp/sca/"{securebank-sbom.spdx.json,securebank-vulns.json,securebank-vulns.md} reports/
          cp "$tmp/secrets/"{control-negativo.json,control-limpio.json,resultado.txt} reports/secrets/
          cp "$tmp/negative/control-negativo.json" reports/secrets/bloqueo-pipeline.json
          cp "$tmp/pdf/"{reporte-dast-SecurePipeline.pdf,report.json,zap-openapi.json,zap-dashboard.png} reports/dast/
          cmp reports/dast/report.json Docs/Evidencias/Sesion_08/report.json
          cp "$tmp/pdf/"{informe-iac-SecurePipeline.pdf,iac-pipeline.png} reports/iac/
          cp "$tmp/iac/"{before.json,after.json,before-gate.json,after-gate.json} reports/iac/
          jq -e '.specVersion == "2.3" or .spdxVersion == "SPDX-2.3"' reports/securebank-sbom.spdx.json
          jq -e '([.runs[].results[]] | length) == 6' reports/sast/sast-before.sarif
          jq -e '([.runs[].results[]] | length) == 0' reports/sast/sast-after.sarif
          jq -e 'length == 1 and .[0].Secret == "REDACTED"' reports/secrets/bloqueo-pipeline.json
          jq -e '.allow == true and .score >= 85' reports/iac/after-gate.json
          (cd reports; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS; sha256sum -c SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "docs: preservar salidas nativas y PDF de evidencias"
          git push origin HEAD:refs/heads/feature/complementos-devsecops
